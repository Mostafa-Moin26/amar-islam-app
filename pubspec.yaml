name: amar_islam
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/bengali/HindSiliguri-Regular.ttf
          weight: 400

        - asset: assets/fonts/bengali/HindSiliguri-Medium.ttf
          weight: 500

        - asset: assets/fonts/bengali/HindSiliguri-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/bengali/HindSiliguri-Bold.ttf
          weight: 700

